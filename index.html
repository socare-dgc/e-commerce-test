<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clean, modern product management dashboard." />
    <title>Catalog — Product Manager</title>
    <script>
      // Apply theme before paint to avoid a light/dark flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('catalog:theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var resolved =
            stored === 'dark' || stored === 'light'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', resolved === 'dark')
          document.documentElement.style.colorScheme = resolved
        } catch (_) {
          /* localStorage unavailable; render default theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
